name: macOS

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  # Preserve the first cold DXC build so its cache can serve newer commits.
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  macos-toolchain:
    name: macOS DXC toolchain
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore native DXC
        id: dxc
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-tools/dxc
          key: dxc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/setup-macos-dxc.sh') }}
      - name: Build pinned native DXC
        if: steps.dxc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install cmake ninja
          mkdir -p build/ci-toolchain
          scripts/ci/setup-macos-dxc.sh 2>&1 | tee build/ci-toolchain/setup.log
      - name: Check cached compiler
        run: .ci-tools/dxc/bin/dxc --version
      - name: Upload toolchain logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-toolchain-logs
          path: build/ci-toolchain/*.log
          if-no-files-found: ignore
          retention-days: 5

  macos:
    name: macOS ${{ matrix.configuration }}
    needs: macos-toolchain
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: macos-debug
          - configuration: Release
            preset: macos-release
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 256M
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install cmake ninja ccache molten-vk vulkan-headers vulkan-loader glfw assimp
      - name: Restore native DXC
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-tools/dxc
          key: dxc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/setup-macos-dxc.sh') }}
          fail-on-cache-miss: true
      - name: Cache compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'scripts/ci/dependencies.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'scripts/ci/dependencies.json') }}-
      - name: Configure
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          mkdir -p "build/$PRESET"
          cmake --preset "$PRESET" -DJENGINE_DXC_EXECUTABLE="$PWD/.ci-tools/dxc/bin/dxc" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee "build/$PRESET/configure.log"
      - name: Build
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET" 2>&1 | tee "build/$PRESET/build.log"
      - name: CPU and shader checks
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --preset "$PRESET" --output-junit "$PWD/build/$PRESET/tests.xml" 2>&1 | tee "build/$PRESET/tests.log"
      - name: Archive build output
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: tar -czf "build/$PRESET/jEngine-${PRESET}-build.tar.gz" -C "build/$PRESET" jEngine
      - name: Cache statistics
        if: always()
        run: ccache --show-stats
      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.preset }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            build/${{ matrix.preset }}/*.log
            build/${{ matrix.preset }}/*.xml
            build/${{ matrix.preset }}/*.tar.gz
            build/${{ matrix.preset }}/shader-checks/**

