name: Windows

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Enable long source paths on the disposable runner
        shell: pwsh
        run: |
          $before = git config --global --get core.longpaths
          Write-Host "Previous core.longpaths: $before"
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache DXC distribution
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-tools/dxc
          key: dxc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/dependencies.json', 'scripts/ci/setup-windows-dxc.ps1') }}
      - name: Install pinned shader compiler
        shell: pwsh
        run: scripts/ci/setup-windows-dxc.ps1
      - name: Generate Visual Studio project, build, and test
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: scripts/ci/build-windows.ps1 -Configuration $env:CONFIGURATION
      - name: Verify preserved native Visual Studio project
        shell: pwsh
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: scripts/ci/build-windows-native.ps1 -Configuration $env:CONFIGURATION
      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-${{ matrix.configuration }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            build/windows-vs2026/*.log
            build/windows-vs2026/*.binlog
            build/windows-vs2026/*.xml
            build/windows-vs2026/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-vs2026/${{ matrix.configuration }}/*.exe
            build/windows-vs2026/${{ matrix.configuration }}/**/*.dll
            build/windows-vs2026/shader-checks/**
            build/windows-native-${{ matrix.configuration }}/*.log
            build/windows-native-${{ matrix.configuration }}/*.binlog
